# Serves the built React dashboard (dist/) and reverse-proxies API/WS
# traffic to the FastAPI dashboard service so the frontend can keep using
# same-origin relative paths ("/events", "/ws/live") in both dev (via the
# Vite proxy, see vite.config.ts) and in this production image -- no CORS
# configuration and no backend URL baked into the JS bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /events {
        proxy_pass http://dashboard:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://dashboard:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://dashboard:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
