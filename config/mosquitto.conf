# Minimal Mosquitto broker config for local development / docker-compose.
#
# Anonymous access is fine here because this broker only exists to move
# events between the analytics container and the dashboard container on a
# private docker-compose network. Do NOT reuse this config for a
# broker reachable from the public internet -- see the README's
# "Limitations & production hardening notes" for what real deployments need
# (TLS listeners, authentication, ACLs).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
