# Pipeline configuration.
#
# This one file drives everything: which video source to read, which model
# to run, how the tracker behaves, which zones/lines/rules to evaluate, and
# where events get published. Swapping a real camera in for the demo video
# (or vice versa) is a one-line change to `camera.source` -- nothing else in
# the pipeline needs to know or care.

camera:
  id: "cam1"

  # --- Local demo video (default) ---------------------------------------
  # Generated by scripts/generate_demo_video.py. Point this at any local
  # file (.mp4/.avi/...) to run against your own recorded footage.
  source: "demo-media/demo.mp4"
  loop: true

  # --- Real RTSP camera (example, commented out) -------------------------
  # To point this at a real camera instead, replace `source` above with an
  # RTSP URL. Most IP cameras / NVRs expose something like:
  #
  # source: "rtsp://user:pass@192.168.1.50:554/stream1"
  #
  # Common vendor path conventions you may need to adjust:
  #   Hikvision : rtsp://user:pass@<ip>:554/Streaming/Channels/101
  #   Dahua     : rtsp://user:pass@<ip>:554/cam/realmonitor?channel=1&subtype=0
  #   ONVIF     : rtsp://user:pass@<ip>:554/onvif1
  #
  # Never commit real camera credentials to source control -- inject them
  # via environment variables / a secrets manager and template the URL at
  # deploy time instead.

detector:
  model_path: "yolov8n.pt" # auto-downloads on first use
  confidence_threshold: 0.4
  classes_of_interest: ["person", "car", "truck", "bus", "motorcycle", "bicycle"]
  device: "cpu" # set to "cuda:0" if a GPU is available

tracker:
  iou_threshold: 0.3
  max_centroid_distance: 60.0
  max_disappeared: 10 # frames a track may go unmatched before it's dropped

publisher:
  mqtt_host: "localhost"
  mqtt_port: 1883
  mqtt_topic: "analytics/events"
  mqtt_qos: 1
  # Optional: also POST every event as JSON to a webhook (e.g. a customer's
  # existing alerting/ticketing system). Leave blank to disable.
  webhook_url: ""

# ---------------------------------------------------------------------------
# Zones: polygons in pixel coordinates (origin top-left, matching OpenCV/
# image convention) for a 640x480 frame, matching the demo video.
# ---------------------------------------------------------------------------
zones:
  - name: "restricted_area"
    camera_id: "cam1"
    polygon:
      - [380, 60]
      - [620, 60]
      - [620, 300]
      - [380, 300]
    rules:
      - type: "restricted_zone_entry"
      - type: "dwell_time_exceeded"
        max_dwell_seconds: 2.0

# ---------------------------------------------------------------------------
# Lines: virtual tripwires. An object crossing the segment between its
# previous-frame and current-frame position triggers `line_crossing`.
# ---------------------------------------------------------------------------
lines:
  - name: "entrance_line"
    camera_id: "cam1"
    points:
      - [0, 240]
      - [640, 240]
    rules:
      - type: "line_crossing"
